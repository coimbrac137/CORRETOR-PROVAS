<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Corretor de Provas</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, sans-serif; background: #f4f4f4; color: #222; padding: 20px; }
header { background: #2c3e50; color: #fff; padding: 15px 20px; border-radius: 6px; margin-bottom: 20px; }
header h1 { font-size: 22px; }
main { background: #fff; padding: 20px; border-radius: 6px; max-width: 900px; margin: 0 auto; }
h2 { margin: 20px 0 10px; font-size: 18px; border-bottom: 2px solid #ecf0f1; padding-bottom: 6px; }
form { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
label { font-weight: bold; font-size: 14px; }
input, select, textarea, button { padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
textarea { resize: vertical; min-height: 150px; font-family: monospace; }
button { background: #2980b9; color: #fff; border: none; cursor: pointer; padding: 10px 15px; }
button:hover { background: #21618c; }
button.secundario { background: #27ae60; }
button.secundario:hover { background: #1e8449; }
table { width: 100%; border-collapse: collapse; margin-top: 10px; }
th, td { border: 1px solid #ddd; padding: 6px 8px; font-size: 13px; text-align: center; }
th { background: #ecf0f1; }
.abas { display: flex; gap: 10px; margin-bottom: 15px; }
.abas button { flex: 1; background: #bdc3c7; }
.abas button.ativa { background: #2980b9; }
.painel { display: none; }
.painel.ativo { display: block; }
.aviso { background: #fff3cd; color: #856404; padding: 10px; border-radius: 4px; margin-bottom: 15px; font-size: 13px; }
</style>
</head>
<body>
<header><h1>Corretor de Provas</h1></header>
<main>

<div class="abas">
    <button type="button" class="ativa" onclick="mostrarAba('img')">Enviar Imagens (Automático)</button>
    <button type="button" onclick="mostrarAba('manual')">Colar Respostas (Manual)</button>
</div>

<!-- ABA IMAGENS -->
<div id="aba-img" class="painel ativo">
    <h2>Enviar Imagens</h2>
    <form method="post" action="../backend/processar.php" enctype="multipart/form-data">
        <label>Foto do cartão do aluno</label>
        <input type="file" name="cartao_aluno" accept="image/*" required>

        <label>Foto do gabarito oficial</label>
        <input type="file" name="cartao_gabarito" accept="image/*" required>

        <button type="submit">Corrigir</button>
    </form>
</div>

<!-- ABA MANUAL -->
<div id="aba-manual" class="painel">
    <h2>Gabarito Oficial (salvo entre correções)</h2>
    <div class="aviso">Digite o gabarito uma vez e clique em <strong>Salvar Gabarito</strong>. Ele ficará salvo para todas as próximas correções.</div>

    <table>
        <tr><th>Q</th><th>Resp.</th><th>Q</th><th>Resp.</th><th>Q</th><th>Resp.</th></tr>
        <tbody id="tabela-gabarito"></tbody>
    </table>

    <button type="button" class="secundario" onclick="salvarGabarito()">Salvar Gabarito</button>
    <div id="status-gabarito" style="margin-top:10px;font-size:13px;"></div>

    <h2>Corrigir Turma (Lote)</h2>
    <form method="post" action="../backend/processar.php">
        <input type="hidden" name="modo" value="lote">
        
        <label>Cole aqui a lista de alunos (Nome + Respostas):</label>
        <textarea name="lista_alunos" placeholder="Exemplo:&#10;João Silva: C B C A B B D A C B D C B B D C C A D B B B A D A A D C C D C A C B B D A D B A B A B A C&#10;Maria Souza: A B C D A B C D A B C D A B C D A B C D A B C D A B C D A B C D A B C D A B C D A B C D A" required></textarea>
        
        <button type="submit">Corrigir Todos</button>
    </form>
</div>

</main>
<script>
function mostrarAba(id) {
    document.querySelectorAll('.painel').forEach(p => p.classList.remove('ativo'));
    document.querySelectorAll('.abas button').forEach(b => b.classList.remove('ativa'));
    document.getElementById('aba-' + id).classList.add('ativo');
    event.target.classList.add('ativa');
}

function criarTabela(tbodyId, prefixo, valores) {
    const tbody = document.getElementById(tbodyId);
    let html = '';
    for (let i = 1; i <= 15; i++) {
        html += '<tr>';
        for (let c = 0; c < 3; c++) {
            const q = i + (c * 15);
            const atual = valores && valores[q] ? valores[q] : '';
            html += '<td>' + q + '</td><td><select name="' + prefixo + q + '">';
            html += '<option value="">-</option>';
            ['A','B','C','D'].forEach(a => {
                const sel = (atual === a) ? ' selected' : '';
                html += '<option value="' + a + '"' + sel + '>' + a + '</option>';
            });
            html += '</select></td>';
        }
        html += '</tr>';
    }
    tbody.innerHTML = html;
}

async function carregarGabarito() {
    try {
        const r = await fetch('../backend/carregar_gabarito.php');
        const dados = await r.json();
        criarTabela('tabela-gabarito', 'gab', dados.gabarito || {});
    } catch (e) {
        criarTabela('tabela-gabarito', 'gab', {});
    }
}

async function salvarGabarito() {
    const form = new FormData();
    for (let i = 1; i <= 45; i++) {
        const sel = document.querySelector('select[name="gab' + i + '"]');
        form.append('gab' + i, sel ? sel.value : '');
    }
    const status = document.getElementById('status-gabarito');
    status.textContent = 'Salvando...';
    try {
        const r = await fetch('../backend/salvar_gabarito.php', { method: 'POST', body: form });
        const dados = await r.json();
        status.textContent = dados.ok ? '✓ Gabarito salvo.' : ('Erro: ' + (dados.erro || 'desconhecido'));
        status.style.color = dados.ok ? '#155724' : '#721c24';
    } catch (e) {
        status.textContent = 'Erro ao salvar: ' + e.message;
        status.style.color = '#721c24';
    }
}

carregarGabarito();
</script>
</body>
</html>
